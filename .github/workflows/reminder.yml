name: Course Reminder

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check-course:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python checker.py

      - name: Save sent lessons
        run: |
          git config user.name "Course Reminder Bot"
          git config user.email "course-reminder@users.noreply.github.com"

          git add sent.json

          git diff --cached --quiet || git commit -m "Update sent lessons"

          git push
