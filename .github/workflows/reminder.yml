
name: Course Reminder

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  generate-schedule:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate schedule
        run: |
          python generate_schedule.py

      - name: Save generated schedule
        run: |
          git config user.name "Course Reminder Bot"
          git config user.email "course-reminder@users.noreply.github.com"

          git add schedule.json

          git diff --cached --quiet || git commit -m "Update course schedule"

          git push
